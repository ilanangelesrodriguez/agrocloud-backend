name: Laravel static checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ms-identity, ms-agricultural]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer validate --strict --no-check-publish
      - name: Check PHP syntax
        run: find app bootstrap config routes database -name '*.php' -print0 | xargs -0 -n1 php -l
