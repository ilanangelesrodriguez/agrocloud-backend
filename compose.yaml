# Canonical local development stack. Additional per-service Compose files are optional overrides.
name: agrocloud

x-node-health: &node-health
  test: [CMD, node, -e, "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
  interval: 20s
  timeout: 5s
  start_period: 30s
  retries: 5

x-laravel-health: &laravel-health
  test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
  interval: 20s
  timeout: 5s
  start_period: 30s
  retries: 5

services:
  gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/node.Dockerfile
      args:
        WORKSPACE: gateway
    environment:
      PORT: "4000"
      IDENTITY_SERVICE_URL: http://ms-identity:8000
      IDENTITY_GATEWAY_CLIENT_IP_KEY: ${IDENTITY_GATEWAY_CLIENT_IP_KEY:-}
      GATEWAY_TRUSTED_PROXY_CIDRS: ${GATEWAY_TRUSTED_PROXY_CIDRS:-}
      AGRICULTURAL_SERVICE_URL: http://ms-agricultural:8000
      BILLING_SERVICE_URL: http://ms-billing:3000
      NOTIFICATIONS_SERVICE_URL: http://ms-notifications:3000
      AI_SERVICE_URL: http://ms-ai:8000
      CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://localhost:3000}
    ports: ["127.0.0.1:${GATEWAY_PORT:-4000}:4000"]
    healthcheck: *node-health

  ms-identity:
    build: &identity-build
      context: .
      dockerfile: services/ms-identity/Dockerfile
    environment: &identity-env
      APP_NAME: AgroCloud-Identity
      APP_URL: http://localhost:${IDENTITY_PORT:-8001}
      APP_ENV: local
      SWAGGER_TRY_IT_OUT: ${IDENTITY_SWAGGER_TRY_IT_OUT:-false}
      APP_DEBUG: "false"
      APP_KEY: ${IDENTITY_APP_KEY:?Set IDENTITY_APP_KEY}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: identity_db
      DB_USERNAME: identity_app
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}
      CACHE_STORE: database
      SESSION_DRIVER: array
      QUEUE_CONNECTION: database
      IDENTITY_FRONTEND_URL: ${IDENTITY_FRONTEND_URL:-http://localhost:3000}
      IDENTITY_GATEWAY_CLIENT_IP_KEY: ${IDENTITY_GATEWAY_CLIENT_IP_KEY:-}
      IDENTITY_PRIVACY_VERSION: ${IDENTITY_PRIVACY_VERSION:-}
      IDENTITY_FREE_PLAN_DAYS: ${IDENTITY_FREE_PLAN_DAYS:-}
      IDENTITY_FREE_PLAN_USERS: ${IDENTITY_FREE_PLAN_USERS:-}
      IDENTITY_FREE_PLAN_LOTS: ${IDENTITY_FREE_PLAN_LOTS:-}
      IDENTITY_FREE_PLAN_AI: ${IDENTITY_FREE_PLAN_AI:-}
      IDENTITY_TOKEN_ISSUER: ${IDENTITY_TOKEN_ISSUER:-agrocloud-identity}
      IDENTITY_TOKEN_AUDIENCE: ${IDENTITY_TOKEN_AUDIENCE:-agrocloud-api}
      IDENTITY_KEY_ID: ${IDENTITY_KEY_ID:-identity-v1}
      IDENTITY_ACCESS_MINUTES: ${IDENTITY_ACCESS_MINUTES:-15}
      IDENTITY_REFRESH_DAYS: ${IDENTITY_REFRESH_DAYS:-14}
      IDENTITY_SERVICE_API_KEY: ${IDENTITY_SERVICE_API_KEY:?Set IDENTITY_SERVICE_API_KEY}
      IDENTITY_BOOTSTRAP_EMAIL: ${IDENTITY_BOOTSTRAP_EMAIL:-}
      IDENTITY_BOOTSTRAP_PASSWORD: ${IDENTITY_BOOTSTRAP_PASSWORD:-}
      BILLING_SERVICE_URL: http://ms-billing:3000
      BILLING_SERVICE_API_KEY: ${BILLING_SERVICE_API_KEY:?Set BILLING_SERVICE_API_KEY}
      AGROCLOUD_EVENT_SECRET: ${AGROCLOUD_EVENT_SECRET:?Set AGROCLOUD_EVENT_SECRET}
      NOTIFICATIONS_EVENT_URL: http://ms-notifications:3000/api/v1/internal/events/identity
      IDENTITY_EVENT_SECRET: ${IDENTITY_EVENT_SECRET:?Set IDENTITY_EVENT_SECRET}
      IDENTITY_BILLING_SANDBOX_CHECKOUT_ENABLED: ${IDENTITY_BILLING_SANDBOX_CHECKOUT_ENABLED:-false}
      IDENTITY_BILLING_OFFERS: ${IDENTITY_BILLING_OFFERS:-}
      SUNAT_RUC_URL: ${SUNAT_RUC_URL:-}
      SUNAT_RUC_KEY: ${SUNAT_RUC_KEY:-}
      MAIL_MAILER: smtp
      MAIL_HOST: ${IDENTITY_MAIL_HOST:-localhost}
      MAIL_PORT: ${IDENTITY_MAIL_PORT:-587}
      MAIL_SCHEME: ${IDENTITY_MAIL_SCHEME:-smtp}
      MAIL_USERNAME: ${IDENTITY_MAIL_USERNAME:-}
      MAIL_PASSWORD: ${IDENTITY_MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${IDENTITY_MAIL_FROM_ADDRESS:-identity@example.invalid}
      MAIL_FROM_NAME: AgroCloud
    volumes: [identity-keys:/app/storage/app/identity]

    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:${IDENTITY_PORT:-8001}:8000"]
    healthcheck: *laravel-health

  identity-mail-worker:
    profiles: [identity-mail]
    build: *identity-build
    environment: *identity-env
    stop_grace_period: 45s
    command: [php, artisan, queue:work, --queue=default, --sleep=3, --tries=3, --timeout=35]
    depends_on:
      postgres:
        condition: service_healthy
    volumes: [identity-keys:/app/storage/app/identity]

  identity-scheduler:
    build: *identity-build
    environment: *identity-env
    command: [php, artisan, schedule:work]
    depends_on:
      postgres:
        condition: service_healthy
    volumes: [identity-keys:/app/storage/app/identity]
    restart: unless-stopped
    stop_grace_period: 45s

  ms-agricultural:
    build: &agricultural-build
      context: .
      dockerfile: services/ms-agricultural/Dockerfile
    environment: &agricultural-env
      AGRICULTURAL_STORAGE_DRIVER: ${AGRICULTURAL_STORAGE_DRIVER:-local}
      AGRICULTURAL_CLOUDINARY_PREFIX: ${AGRICULTURAL_CLOUDINARY_PREFIX:-agrocloud/agricultural}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      APP_NAME: AgroCloud-Agricultural
      APP_URL: http://localhost:${AGRICULTURAL_PORT:-8002}
      APP_ENV: local
      SWAGGER_TRY_IT_OUT: ${AGRICULTURAL_SWAGGER_TRY_IT_OUT:-false}
      APP_DEBUG: "false"
      APP_KEY: ${AGRICULTURAL_APP_KEY:?Set AGRICULTURAL_APP_KEY}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: agricultural_db
      DB_USERNAME: agricultural_app
      DB_PASSWORD: ${AGRICULTURAL_DB_PASSWORD:?Set AGRICULTURAL_DB_PASSWORD}
      SESSION_DRIVER: array
      CACHE_STORE: database
      IDENTITY_SERVICE_URL: http://ms-identity:8000
      IDENTITY_SERVICE_API_KEY: ${IDENTITY_SERVICE_API_KEY:?Set IDENTITY_SERVICE_API_KEY}
      AI_SERVICE_URL: http://ms-ai:8000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?Set AI_SERVICE_API_KEY}
      AI_CLOUD_RUN_IAM_ENABLED: "false"
      AI_SUPPORTED_PRODUCTS: ${AI_SUPPORTED_PRODUCTS:-palta}
      NOTIFICATIONS_EVENT_URL: ${NOTIFICATIONS_EVENT_URL:-http://ms-notifications:3000/api/v1/internal/events/agricultural}
      AGRICULTURAL_EVENT_SECRET: ${AGRICULTURAL_EVENT_SECRET:?Set AGRICULTURAL_EVENT_SECRET}
      AGRICULTURAL_FRONTEND_URL: ${AGRICULTURAL_FRONTEND_URL:-http://localhost:3000}
      MANUAL_SAMPLING_ENABLED: ${MANUAL_SAMPLING_ENABLED:-false}
      SAMPLING_MAX_FRUITS: ${SAMPLING_MAX_FRUITS:-100000}
      SAMPLING_WARNING_FRUITS: ${SAMPLING_WARNING_FRUITS:-500}
      SUNAT_RUC_URL: ${SUNAT_RUC_URL:-}
      SUNAT_RUC_KEY: ${SUNAT_RUC_KEY:-}
    volumes: [agricultural-evidence:/app/storage/app/agricultural]

    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:${AGRICULTURAL_PORT:-8002}:8000"]
    healthcheck: *laravel-health

  agricultural-ai-worker:
    build: *agricultural-build
    environment: *agricultural-env
    command: [php, artisan, agricultural:work, --ai-only]
    restart: unless-stopped
    stop_grace_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
      ms-identity:
        condition: service_healthy
      ms-ai:
        condition: service_healthy
    volumes: [agricultural-evidence:/app/storage/app/agricultural]

  agricultural-events-worker:
    build: *agricultural-build
    environment: *agricultural-env
    command: [php, artisan, agricultural:work, --events-only]
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
    volumes: [agricultural-evidence:/app/storage/app/agricultural]

  ms-billing:
    build: &billing-build
      context: .
      dockerfile: services/ms-billing/Dockerfile
    environment: &billing-env
      NODE_ENV: development
      PORT: "3000"
      MONGODB_URI: mongodb://mongo:27017/agrocloud_billing
      SERVICE_API_KEY: ${BILLING_SERVICE_API_KEY:?Set BILLING_SERVICE_API_KEY}
      CULQI_MODE: test
      CULQI_SECRET_KEY: ${CULQI_SECRET_KEY:?Set CULQI_SECRET_KEY}
      CULQI_PUBLIC_KEY: ${CULQI_PUBLIC_KEY:?Set CULQI_PUBLIC_KEY}
      CULQI_WEBHOOK_TOKEN: ${CULQI_WEBHOOK_TOKEN:?Set CULQI_WEBHOOK_TOKEN}
      AGROCLOUD_EVENT_URL: ${AGROCLOUD_EVENT_URL:-http://ms-identity:8000/api/v1/internal/billing/events}
      AGROCLOUD_EVENT_SECRET: ${AGROCLOUD_EVENT_SECRET:?Set AGROCLOUD_EVENT_SECRET}
      NOTIFICATIONS_EVENT_URL: http://ms-notifications:3000/api/v1/internal/events/billing
      BILLING_EVENT_SECRET: ${BILLING_EVENT_SECRET:?Set BILLING_EVENT_SECRET}
      OUTBOX_TIMER_ENABLED: ${BILLING_OUTBOX_TIMER_ENABLED:-false}
    ports: ["127.0.0.1:${BILLING_PORT:-4001}:3000"]
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck: *node-health

  billing-outbox-worker:
    build: *billing-build
    environment: *billing-env
    command: [node, dist/worker.js]
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      mongo:
        condition: service_healthy
      ms-identity:
        condition: service_healthy

  ms-notifications:
    build: &notifications-build
      context: .
      dockerfile: services/ms-notifications/Dockerfile
    environment: &notifications-env
      NODE_ENV: development
      SWAGGER_TRY_IT_OUT: ${NOTIFICATIONS_SWAGGER_TRY_IT_OUT:-false}
      PORT: "3000"
      DATABASE_URL: postgresql://notifications_app:${NOTIFICATIONS_DB_PASSWORD:?Set NOTIFICATIONS_DB_PASSWORD}@postgres:5432/notifications_db
      IDENTITY_SERVICE_URL: http://ms-identity:8000
      IDENTITY_SERVICE_API_KEY: ${IDENTITY_SERVICE_API_KEY:?Set IDENTITY_SERVICE_API_KEY}
      AGRICULTURAL_EVENT_SECRET: ${AGRICULTURAL_EVENT_SECRET:?Set AGRICULTURAL_EVENT_SECRET}
      IDENTITY_EVENT_SECRET: ${IDENTITY_EVENT_SECRET:?Set IDENTITY_EVENT_SECRET}
      BILLING_EVENT_SECRET: ${BILLING_EVENT_SECRET:?Set BILLING_EVENT_SECRET}
      NOTIFICATIONS_OPERATOR_KEY: ${NOTIFICATIONS_OPERATOR_KEY:-}
      FRONTEND_URL: ${NOTIFICATIONS_FRONTEND_URL:-http://localhost:3000}
      MAIL_ENABLED: ${NOTIFICATIONS_MAIL_ENABLED:-false}
      SMTP_URL: ${NOTIFICATIONS_SMTP_URL:-}
      MAIL_FROM: ${NOTIFICATIONS_MAIL_FROM:-}
      MAX_EVENT_RECIPIENTS: ${NOTIFICATIONS_MAX_EVENT_RECIPIENTS:-10000}
      WORKER_INTERVAL_MS: ${NOTIFICATIONS_WORKER_INTERVAL_MS:-1000}
    depends_on:
      postgres:
        condition: service_healthy

    ports: ["127.0.0.1:${NOTIFICATIONS_PORT:-4002}:3000"]
    healthcheck: *node-health

  notifications-worker:
    build: *notifications-build
    environment: *notifications-env
    command: [node, dist/worker.js]
    stop_grace_period: 180s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ms-identity:
        condition: service_healthy

  ms-ai:
    build:
      context: ./services/ms-ai
    environment:
      APP_ENV: development
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg://ai_app:${AI_DB_PASSWORD:?Set AI_DB_PASSWORD}@postgres:5432/ai_db
      AUTO_CREATE_TABLES: "false"
      SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?Set AI_SERVICE_API_KEY}
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
    command: [sh, -c, "alembic upgrade head && exec uvicorn agrocloud_ai.main:app --host 0.0.0.0 --port 8000 --workers 1"]
    ports: ["127.0.0.1:${AI_PORT:-8003}:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agrocloud_admin
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD:?Set POSTGRES_DEV_PASSWORD}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}
      AGRICULTURAL_DB_PASSWORD: ${AGRICULTURAL_DB_PASSWORD:?Set AGRICULTURAL_DB_PASSWORD}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?Set NOTIFICATIONS_DB_PASSWORD}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?Set AI_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sh:/docker-entrypoint-initdb.d/10-services.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U agrocloud_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:8
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  mongo-data:
  identity-keys:
  agricultural-evidence:
