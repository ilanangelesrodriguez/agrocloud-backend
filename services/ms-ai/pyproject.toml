[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrocloud-ai-rfdetr"
version = "2.1.0"
description = "Microservicio Python de visión por computadora para AgroCloud, basado en RF-DETR Small V2"
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.12,<1.0",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "psycopg[binary]>=3.2,<4",
  "Pillow>=10.4,<13",
  "httpx>=0.27,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "cloudinary>=1.40,<3.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8.2,<10", "pytest-cov>=5,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agrocloud_ai = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["agrocloud_ai"]
