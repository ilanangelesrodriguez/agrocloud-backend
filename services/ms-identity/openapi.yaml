    "/public/ruc/lookup": {
      "post": {
        "operationId": "lookupPublicRuc",
        "summary": "Consultar información tributaria de un RUC",
        "tags": [
          "Solicitudes de acceso"
        ],
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "ruc": {
                    "type": "string",
                    "pattern": "^[0-9]{11}$"
                  }
                },
                "required": [
                  "ruc"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Resultado de consulta, incluida indisponibilidad temporal",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "object",
                      "properties": {
                        "ruc": {
                          "type": "string",
                          "pattern": "^[0-9]{11}$"
                        },
                        "resultado": {
                          "type": "string",
                          "enum": [
                            "verificado",
                            "pendiente",
                            "no_encontrado"
                          ]
                        },
                        "mensaje": {
                          "type": "string"
                        },
                        "razon_social": {
                          "type": "string"
                        },
                        "estado": {
                          "type": "string",
                          "nullable": true
                        },
                        "condicion": {
                          "type": "string",
                          "nullable": true
                        }
                      },
                      "required": [
                        "ruc",
                        "resultado",
                        "mensaje"
                      ]
                    }
                  },
                  "required": [
                    "data"
                  ]
                }
              }
            }
          },
          "422": {
            "description": "RUC con formato inválido"
          },
          "429": {
            "description": "Límite de consultas alcanzado"
          }
        }
      }
    },
